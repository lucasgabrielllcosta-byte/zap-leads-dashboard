name: Atualizar dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar data/dashboard.json
        env:
          ZAP_API_TOKEN: ${{ secrets.ZAP_API_TOKEN }}
        run: |
          mkdir -p data
          node build-data.mjs > data/dashboard.json
      - name: Preparar site estático
        run: |
          mkdir -p site
          cp index.html site/
          cp -r data site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
