name: Atualizar dashboard

on:
  schedule:
    # Minuto 7 (não 0) de propósito — o GitHub Actions costuma sobrecarregar/atrasar
    # execuções agendadas pros minutos redondos (0, 15, 30, 45), porque é quando todo
    # mundo agenda. Fugir do horário redondo reduz a chance de a execução ser pulada
    # (aconteceu de verdade em 2026-08-04: ficou ~5h sem rodar por causa disso).
    - cron: '7 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Push (mudança só de código/UI) não reconsulta a API — reaproveita o último
      # data.json publicado, pra não gastar ~30min toda vez que eu ajustar o layout.
      # Só schedule (de hora em hora) e workflow_dispatch (botão "Atualizar agora"
      # ou manual) de fato buscam dados novos.
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20
      - run: npm ci
        if: github.event_name != 'push'
      - name: Restaurar cache de origem-IA
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: cache
          key: origem-ia-cache-${{ github.run_id }}
          restore-keys: |
            origem-ia-cache-
      - name: Gerar data/dashboard.json
        if: github.event_name != 'push'
        env:
          ZAP_API_TOKEN: ${{ secrets.ZAP_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data
          node build-data.mjs > data/dashboard.json
      - name: Baixar dashboard.json publicado (referência pra validação)
        if: github.event_name != 'push'
        run: curl -sf https://lucasgabrielllcosta-byte.github.io/zap-leads-dashboard/data/dashboard.json -o /tmp/dashboard-anterior.json || true
      - name: Validar dados antes de publicar
        # Portão de segurança: se os números não baterem (ex: queda ou alta suspeita
        # no total de leads, campo corrompido), para o workflow aqui. O site continua
        # servindo a última versão publicada — nada errado ou duplicado vai pro ar.
        if: github.event_name != 'push'
        run: node validar-dados.mjs data/dashboard.json /tmp/dashboard-anterior.json
      - name: Persistir candidatos-regex.json e titularidade (trocas de departamento)
        # Push com GITHUB_TOKEN não reaciona o trigger "push" deste workflow, então
        # não há risco de loop infinito aqui. departamentos-snapshot.json é o que
        # titularidade-sync.mjs usa pra detectar troca de titular na próxima execução —
        # sem commitar ele, toda execução acharia "sem snapshot anterior" de novo.
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- candidatos-regex.json titularidade-departamentos.json departamentos-snapshot.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add candidatos-regex.json titularidade-departamentos.json departamentos-snapshot.json
            git commit -m "Atualiza candidatos-regex.json e titularidade de departamentos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reaproveitar data.json já publicado (push de código só)
        if: github.event_name == 'push'
        run: |
          mkdir -p data
          curl -sf https://lucasgabrielllcosta-byte.github.io/zap-leads-dashboard/data/dashboard.json -o data/dashboard.json
      - name: Preparar site estático
        run: |
          mkdir -p site
          cp index.html site/
          cp -r data site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
