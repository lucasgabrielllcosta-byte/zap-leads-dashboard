name: Atualizar leads novos (fast-track)

# Gera data/novos.json com só os leads dos últimos 2 dias, bem mais rápido que o
# pipeline completo (data/dashboard.json, 30 dias, hora em hora — ver deploy.yml).
# Publicado direto no repositório (commit comum), não pelo GitHub Pages — assim não
# entra na fila de deploy do dashboard.json principal. O index.html busca esse arquivo
# direto do GitHub (raw.githubusercontent.com) e mescla com o dashboard.json no
# navegador: cada dia é "dono" de uma fonte só (nunca as duas), pra nunca duplicar um
# lead com dois status ao mesmo tempo.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: novos-leads
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Guardar novos.json anterior (referência pra validação)
        run: cp data/novos.json /tmp/novos-anterior.json 2>/dev/null || true
      - name: Gerar data/novos.json (janela curta — só leads recentes)
        env:
          ZAP_API_TOKEN: ${{ secrets.ZAP_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIAS_JANELA: '2'
          DIAS_ENTENDIMENTO_IA: '2'
          # Descartáveis de propósito — quem registra candidatos-regex e titularidade "de
          # verdade" é o deploy.yml (hora em hora); aqui só evita os dois workflows
          # brigando pelo mesmo arquivo. SNAPSHOT_PATH descartável faz esta execução
          # sempre cair no caso "sem snapshot anterior" (nunca detecta troca sozinha,
          # nunca comita nada) — só o deploy.yml, com o snapshot real, de fato detecta
          # e publica trocas de titular de departamento.
          CANDIDATOS_PATH: /tmp/candidatos-fast-descartavel.json
          SNAPSHOT_PATH: /tmp/snapshot-fast-descartavel.json
        run: |
          mkdir -p data
          node build-data.mjs > data/novos.json
      - name: Validar antes de publicar
        # Limites mais soltos que o validar-dados.mjs padrão: janela de 2 dias oscila
        # muito mais em proporção que a de 30 dias, isso é esperado, não é bug.
        env:
          VALIDAR_QUEDA_MAX: '0.2'
          VALIDAR_AUMENTO_MAX: '20'
        run: node validar-dados.mjs data/novos.json /tmp/novos-anterior.json
      - name: Publicar novos.json direto no repositório
        # GITHUB_TOKEN padrão não reaciona o trigger "push" do deploy.yml (mesmo
        # mecanismo já usado ali pro commit de candidatos-regex.json) — sem risco de
        # disparar o pipeline completo nem de entrar na fila de deploy do Pages.
        #
        # Merge (não rebase) com "-X ours": se um "Re-run jobs" reexecutar a partir de
        # um commit antigo enquanto o main já tem um novos.json mais novo (de outra
        # execução), o Git vê isso como dois lados "criando" o mesmo arquivo (conflito
        # add/add) e um rebase simples trava. Como o arquivo é sempre gerado do zero
        # (nunca editado incrementalmente), a versão recém-gerada é sempre a certa —
        # "-X ours" resolve esse conflito automaticamente ficando com ela.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/novos.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza data/novos.json (fast-track)"
            git fetch origin main
            git merge -X ours --no-edit origin/main
            git push origin HEAD:main
          fi
